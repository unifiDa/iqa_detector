[workspace]
name = "iqa-detector"
description = "Image-quality analysis of inpainted/generated images: coherence, quality, prompt adherence, FID/KID, age estimation and filtering"
channels = ["conda-forge"]
platforms = ["linux-64"]          # Linux x86_64 only

# Environments:
#   gpu      -> NVIDIA GPU: torch CUDA 12.8 + onnxruntime-gpu. Everything except MPS.
#   cpu      -> no GPU:                         pixi run -e cpu <task>
#   mps      -> MPS only, on GPU: transformers 4.27.3, the version the checkpoint was saved with.
#                                               pixi run -e mps mps ...
#   mps-cpu  -> MPS only, no GPU: fp32, slower.
#                                               pixi run -e mps-cpu mps ...
# Stages that use torch (quality, prompt, dataset, age, gpu-check) and prepare (insightface) only exist in `-e gpu` / `-e cpu`;
# coherence, padding, merge, filter and make_prompts only need pandas/OpenCV and run in the default environment.
# GPU check: pixi run -e gpu gpu-check
[environments]
gpu = { features = ["gpu", "eval", "eval-gpu"], solve-group = "gpu" }
cpu = { features = ["cpu", "eval", "eval-cpu"], solve-group = "cpu" }
mps = { features = ["gpu", "mps"] }
mps-cpu = { features = ["cpu", "mps"] }

[dependencies]
python = "3.11.*"
numpy = "<2"              # avoids compatibility problems with insightface/onnxruntime
pandas = "*"
opencv = ">=4.10"         # >= 4.10 for FaceDetectorYN (YuNet, used by e_age.py)
matplotlib = "*"          # notebook plots
jupyterlab = "*"          # to open the notebooks
ipykernel = "*"
ipywidgets = "*"          # interactive controls of the notebooks in eval_suite/

# ---- torch ------------------------------------------------------------------------------------
# RTX 5090 = Blackwell (sm_120): needs torch >= 2.7 compiled with CUDA >= 12.8.
# cu128 wheels: a CUDA 13 driver runs CUDA 12.x programs without problems, and the
# nvidia-*-cu12 packages that come with torch (cuBLAS 12, cuDNN 9) also serve onnxruntime-gpu.
[feature.gpu.pypi-dependencies]
torch = { version = ">=2.8", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = ">=0.23", index = "https://download.pytorch.org/whl/cu128" }

[feature.cpu.dependencies]
pytorch-cpu = "*"         # torch without CUDA (much lighter)
torchvision = "*"

# ---- metrics (everything except MPS) --------------------------------------------------------------
[feature.eval.pypi-dependencies]
pyiqa = "*"
insightface = "*"
transformers = ">=4.45"   # CLIP score (c_prompt.py) and age classifier (e_age.py)
clean-fid = "*"           # dataset-level FID/KID (d_dataset.py)
pillow = "*"

[feature.eval-gpu.pypi-dependencies]
onnxruntime-gpu = ">=1.21"   # insightface on GPU; falls back to the CPU by itself if CUDA does not work

[feature.eval-cpu.pypi-dependencies]
onnxruntime = "*"

# ---- MPS --------------------------------------------------------------------------------------
# The MPS checkpoint is the whole model serialised with pickle, including the internal classes of
# transformers 4.27.3 (e.g. CLIPTextTransformer, removed in recent versions): it only opens with
# that version. huggingface-hub and tokenizers must be kept to the same era (early 2023).
[feature.mps.pypi-dependencies]
transformers = "==4.27.3"
tokenizers = ">=0.13.3,<0.14"
huggingface-hub = ">=0.11,<0.17"
pillow = "*"
einops = ">=0.8.2, <0.9"

[feature.mps.tasks.mps]
# pixi run -e mps     mps results/ prompts.jsonl MPS_overall_checkpoint.pth MPS/   (GPU, fp16)
# pixi run -e mps-cpu mps results/ prompts.jsonl MPS_overall_checkpoint.pth MPS/   (CPU, fp32)
# (appends to c_prompt.csv without redoing CLIP, then updates results.csv)
args = ["out", "prompts", "ckpt", "repo"]
cmd = """python eval_suite/c_prompt.py --out {{ out }} --prompts {{ prompts }} --metrics mps \
--mps-ckpt {{ ckpt }} --mps-repo {{ repo }} && python eval_suite/merge.py --out {{ out }}"""

# Tasks that need torch / onnxruntime / insightface live in the features of the environments that have them, so
# they do not exist in `default` (there `pixi run quality` would just fail with "No module named torch").
#   feature gpu  -> gpu-check                       (pixi run -e gpu gpu-check)
#   feature eval -> prepare, quality, prompt, dataset, age   (pixi run -e gpu|cpu <task>)
#   all environments (pandas / OpenCV only) -> the [tasks] below

[feature.gpu.tasks]
# checks that torch and onnxruntime use the GPU
gpu-check = "python eval_suite/gpu_check.py"

[feature.eval.tasks]
# pixi run -e gpu prepare --images imgs/ --masks masks/ --out results/      (insightface finds the faces)
prepare = "python eval_suite/prepare.py"
# pixi run -e gpu quality --out results/     (B: topiq_nr-face, musiq, clipiqa)
quality = "python eval_suite/b_quality.py"
# pixi run -e gpu prompt --out results/ --prompts prompts.jsonl      (C: CLIP score; for MPS use the mps task)
prompt = "python eval_suite/c_prompt.py"
# pixi run -e gpu dataset --out results/ --ref originals/crops/face  (D: FID/KID)
dataset = "python eval_suite/d_dataset.py"
# pixi run -e gpu age --out results/         (E: age of the faces -> e_age.csv; --crops to use the face crops)
age = "python eval_suite/e_age.py"

[tasks]
# ---- eval_suite: one stage per task; the trailing arguments are passed to the script ----
# Only need pandas / OpenCV: they run in any environment, `default` included.
# pixi run prepare_generic --images imgs/ --masks masks/ --out results/      (no face detection)
prepare_generic = "python eval_suite/prepare_generic.py"
# pixi run make_prompts --json-dir jsons/ --out prompts.jsonl --images imgs/
make_prompts = "python eval_suite/make_prompts.py"
# pixi run coherence --out results/          (A: blur, Lab tint, seam)
coherence = "python eval_suite/a_coherence.py"
# pixi run padding --out results/            (replicated pixels in the frame and crops outside the frame; flags for merge)
padding = "python eval_suite/check_padding.py"
# pixi run merge --out results/              (results.csv + summary.json)
merge = "python eval_suite/merge.py"
# pixi run filter --out results/ --by-frame  (keeps colour images without minors -> results/filtered/)
filter = "python eval_suite/filter_images.py"

# pixi run export --out results/             (PDF contact sheet + list of the kept images -> results/filtered/kept.pdf, kept.txt)
export = "python eval_suite/export_images.py"

# pixi run reject --out results/ --list rejected.txt   (moves the images you rejected by eye from kept.csv to discarded.csv)
reject = "python eval_suite/reject_images.py"
# pixi run analyze --out results/            (resolution + range of every metric of the final dataset -> filtered/analysis/)
analyze = "python eval_suite/analyze_dataset.py"

[tasks.lab]
# opens JupyterLab: pixi run lab, then one of the eval_suite/viewer_*.ipynb notebooks
cmd = "jupyter lab"